<script>
var idUsuario = sessionStorage.getItem(`ID_USUARIO`)
var concluidas = []
var aulasArray = []
    async function exibirAulas() {
       fetch("/aulas/listar").then(resposta =>{
        resposta.json().then(json =>{
         json.forEach(aula => {
            aulasArray.push(aula.id)
            aulas.innerHTML += `
            <div class="bloco-aula-pai">
            <a href = "${aula.video_url}" class="bloco-aula" id ="div_${aula.id}" >
                            <label>
                                ${aula.nome}
                            </label>
                            </a>
                            
                            
                            <button onclick="controladorAulasConcluidas(${aula.id})" id ="botao_${aula.id}" class="botao">Marcar como concluída</button>
                            </div>
                            <br>
                            
            `
         });   
        })
       })
       
        
      var resposta = await fetch(`/aulas/concluidas/${idUsuario}`)
       var json = await resposta.json()
       json.forEach(aula =>{
        concluidas.push(aula.id)
       })
       estilizarAulasConcluidas()
    }

    async function controladorAulasConcluidas(id){
    let elemento = document.getElementById(`botao_${idUsuario}`)
        if(concluidas.indexOf(id) == -1){
           var respostaConcluir = await fetch(`/aulas/concluir/${idUsuario}/${id}`,{
                method:"POST", headers: {"Content-Type": "application/json"}
            })
            if(respostaConcluir.status == 200){
                concluidas.push(id)

                estilizarAulasConcluidas()
            }
            else{
                alert("algo deu errado")
            }

        }
        else{
             var respostaDesconcluir = await fetch(`/aulas/desconcluir/${idUsuario}/${id}`,{
                method:"POST", headers: {"Content-Type": "application/json"}
            })
            if(respostaDesconcluir.status == 200){
                concluidas.splice(concluidas.indexOf(id),1)

                estilizarAulasConcluidas()
            }
            else{
                alert("algo deu errado")
            }


        }

        
    }
    function estilizarAulasConcluidas(){
        console.log(aulas)
        aulasArray.forEach(aulaId =>{
        var botao = document.getElementById(`botao_${aulaId}`)
        var div = document.getElementById(`div_${aulaId}`)
        console.log(botao)
        console.log(div)

            if(concluidas.includes(aulaId)){
        botao.innerHTML = `Concluída`
        div.style.backgroundColor = "#202e20"
        
            }
            else{
                div.style.background = "#0d4e1a"
                botao.innerHTML = "Marcar como concluída"

            }
        })
        


    }
   
</script>
